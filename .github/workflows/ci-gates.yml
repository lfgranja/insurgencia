name: deterministic-gates

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check SDD completeness
        run: python3 scripts/ci/check_sdd_completeness.py

      - name: Check work order DAG
        run: python3 scripts/ci/check_work_order_dag.py

      - name: Check task ID uniqueness
        run: python3 scripts/ci/check_task_id_uniqueness.py

      - name: Check converge append-only
        run: python3 scripts/ci/check_converge_append_only.py

      - name: Hub docs gate
        run: python3 scripts/ci/hub_docs_gate.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain fixada em rust-toolchain.toml (1.99.1 + rustfmt/clippy).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, rustfmt

      # verify.sh usa cargo nextest quando disponível e faz fallback para
      # cargo test --locked --workspace; nenhuma action de terceiros é exigida.
      - name: Gate Rust (verify.sh)
        run: ./verify.sh
